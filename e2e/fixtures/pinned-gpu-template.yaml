# Fully pinned template for the #69 e2e (e2e/pinned-template.spec.ts): every resource
# axis has min == max, so the create form has nothing editable to serialize and must omit
# spec.resources entirely — the operator's admission then stamps defaultResources
# verbatim, including the accelerator request the form never renders. Storage stays
# editable to prove spec.storage still rides on the same submit. Kind-scale mirror of the
# jupyter-deploy GPU card's shape.
apiVersion: workspace.jupyter.org/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: pinned-gpu
  namespace: default
  labels:
    workspace.jupyter.org/default-template: 'false'
spec:
  displayName: Pinned GPU
  description: Fully pinned GPU template for e2e
  defaultImage: nginx:latest
  resourceBounds:
    resources:
      cpu:
        min: 500m
        max: 500m
      memory:
        min: 1Gi
        max: 1Gi
      nvidia.com/gpu:
        min: '1'
        max: '1'
  defaultResources:
    requests:
      cpu: 500m
      memory: 1Gi
      nvidia.com/gpu: '1'
    limits:
      cpu: 500m
      memory: 1Gi
      nvidia.com/gpu: '1'
  primaryStorage:
    defaultSize: 5Gi
    minSize: 5Gi
    maxSize: 10Gi
